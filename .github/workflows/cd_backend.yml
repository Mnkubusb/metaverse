name: Continuous Deployment Backend
# Legacy EC2 deploy. The API now deploys on Vercel and the WebSocket server on Render
# (see README "Deploying"), so this only runs when started by hand from the Actions tab.
on:
  workflow_dispatch:
jobs: 
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/backend:latest
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/backend:latest
            sudo docker stop backend || true
            sudo docker rm backend || true
            # Secrets live in ~/metaverse.env on the server (DATABASE_URL, JWT_SECRET, ALLOWED_ORIGIN)
            sudo docker run -d --restart unless-stopped --name backend --env-file ~/metaverse.env -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/backend:latest
