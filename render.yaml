# Render Blueprint for the realtime (WebSocket) server as one long-lived process (the alternative
# to running it on Vercel Functions + Redis, see README "Deploying"). Dashboard: New > Blueprint > this repo.
services:
  - type: web
    name: metaverse-ws
    runtime: docker
    plan: free
    dockerfilePath: ./docker/Dockerfile.ws
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Same Neon database and JWT secret as the API on Vercel
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # Only needed if you scale this service to more than one instance
      # - key: REDIS_URL
      #   sync: false
